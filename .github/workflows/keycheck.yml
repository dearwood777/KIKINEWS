name: Key Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List models
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          echo "=== gemini models ==="
          curl -s -m 30 "https://generativelanguage.googleapis.com/v1beta/models" \
            -H "X-goog-api-key: ${GOOGLE_API_KEY}" -o gm.json -w "HTTP=%{http_code}\n"
          python3 - <<'PY'
import json
try:
    d = json.load(open('gm.json'))
    names = [m.get('name') for m in d.get('models', [])]
    print("count=", len(names))
    ok = [n for n in names if ('flash' in n or 'pro' in n)]
    for n in sorted(ok)[:60]:
        print(" ", n)
except Exception as e:
    print("parse_fail", e)
    print(open('gm.json').read()[:500])
PY
          echo "=== groq models ==="
          curl -s -m 30 "https://api.groq.com/openai/v1/models" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" -o gr.json -w "HTTP=%{http_code}\n"
          python3 - <<'PY'
import json
try:
    d = json.load(open('gr.json'))
    ids = [m.get('id') for m in d.get('data', [])]
    print("count=", len(ids))
    for i in sorted(ids)[:60]:
        print(" ", i)
except Exception as e:
    print("parse_fail", e)
    print(open('gr.json').read()[:500])
PY
          exit 0
