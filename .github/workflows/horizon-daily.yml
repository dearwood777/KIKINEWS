name: Horizon Daily Digest

on:
  schedule:
    # GitHub 定时任务用 UTC：22:00 UTC = 次日 06:00 北京时间
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "用哪个大模型跑（需先在仓库 Secrets 里配好对应 key）"
        type: choice
        options: [gemini, groq]
        default: gemini
      hours:
        description: "抓取时间窗口（小时）"
        type: string
        default: "24"

permissions:
  contents: write

concurrency:
  group: horizon-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --locked || uv sync

      - name: Select AI config
        run: |
          P="${{ inputs.provider }}"
          if [ -z "$P" ]; then P="gemini"; fi
          echo "Using provider: $P"
          cp "configs/config.actions.${P}.json" data/config.json

      - name: Point Jekyll at this repository
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          sed -i "s|^baseurl:.*|baseurl: \"/${REPO_NAME}\"|" docs/_config.yml
          sed -i "s|^url:.*|url: \"https://${OWNER}.github.io\"|" docs/_config.yml
          grep -E '^(baseurl|url):' docs/_config.yml

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours ${{ inputs.hours || '24' }}

      - name: Install markdown
        run: python -m pip install --quiet markdown

      - name: Build mobile digest page
        run: python scripts/build_latest.py

      - name: Show what was produced
        run: |
          ls -l docs/latest.html docs/latest.json || true
          cat docs/latest.json || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: true
          commit_message: "digest: ${{ github.run_id }}"
