name: Horizon Daily Digest

on:
  schedule:
    # GitHub 定时任务用 UTC：22:00 UTC = 次日 06:00 北京时间（用户在国内）
    # 另留 23:00 UTC（07:00 北京时间）做兜底：GitHub 的 schedule 偶发延迟/丢触发，
    # 第二次触发时若当天内容已发布，会被守卫步骤直接跳过，不浪费额度。
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "用哪个大模型跑（需先在仓库 Secrets 里配好对应 key）"
        type: choice
        options: [groq, gemini]
        default: groq
      hours:
        description: "抓取时间窗口（小时）"
        type: string
        default: "12"
      probe:
        description: "只做一次模型连通性探测，不跑日报（yes/no）"
        type: string
        default: "no"
      model:
        description: "探测用的模型名"
        type: string
        default: "gemini-3.8-flash"

permissions:
  contents: write

concurrency:
  group: horizon-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if today's digest already published
        id: guard
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          PUB=$(curl -fsS -m 20 "https://dearwood777.github.io/KIKINEWS/latest.json?t=$(date +%s)" \
                | python3 -c "import sys,json;print(json.load(sys.stdin).get('generated_at','')[:10])" 2>/dev/null || echo "")
          echo "today=$TODAY published=$PUB"
          if [ "$PUB" = "$TODAY" ]; then
            echo "今天的内容已经发布过了，跳过本次抓取（省额度）"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'yes'
        if: steps.guard.outputs.skip != 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.guard.outputs.skip != 'yes'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'yes'
        run: uv sync --locked || uv sync

      - name: Select AI config
        if: steps.guard.outputs.skip != 'yes'
        run: |
          P="${{ inputs.provider }}"
          if [ -z "$P" ]; then P="groq"; fi
          echo "Using provider: $P"
          cp "configs/config.actions.${P}.json" data/config.json

      - name: Point Jekyll at this repository
        if: steps.guard.outputs.skip != 'yes'
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          sed -i "s|^baseurl:.*|baseurl: \"/${REPO_NAME}\"|" docs/_config.yml
          sed -i "s|^url:.*|url: \"https://${OWNER}.github.io\"|" docs/_config.yml
          grep -E '^(baseurl|url):' docs/_config.yml

      - name: Probe Gemini model
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe == 'yes' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set +e
          M="${{ inputs.model }}"
          echo "probing model: $M  key_len=${#GOOGLE_API_KEY}"
          curl -s -m 30 -o resp.json -w "HTTP=%{http_code} t=%{time_total}\n" \
            -X POST "https://generativelanguage.googleapis.com/v1beta/models/${M}:generateContent" \
            -H 'Content-Type: application/json' -H "X-goog-api-key: ${GOOGLE_API_KEY}" \
            -d '{"contents":[{"parts":[{"text":"Say OK"}]}]}' || echo "curl_exit=$?"
          head -c 700 resp.json; echo
          echo "=== groq models ==="
          curl -s -m 30 -o gr.json -w "groq_http=%{http_code}\n" "https://api.groq.com/openai/v1/models" \
            -H "Authorization: Bearer ${GROQ_API_KEY}" || echo "groq_curl_exit=$?"
          python3 -c "import json;d=json.load(open('gr.json'));print('\n'.join(sorted(m['id'] for m in d.get('data',[]))))" 2>/dev/null | head -40 || head -c 300 gr.json
          echo "=== groq chat test ==="
          curl -s -m 60 -o gc.json -w "groq_chat_http=%{http_code}\n" \
            -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H 'Content-Type: application/json' -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"Say OK"}],"max_tokens":20}' || echo "groq_chat_exit=$?"
          head -c 500 gc.json; echo
          exit 0

      - name: Run Horizon
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe != 'yes' && steps.guard.outputs.skip != 'yes' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours ${{ inputs.hours || '24' }}

      # ---- 判断这一期有没有真的抓到东西（空就换另一个 API 重跑一次）----
      - name: Check digest result
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe != 'yes' && steps.guard.outputs.skip != 'yes' }}
        id: digest
        run: |
          set +e
          COUNT=$(python scripts/count_digest.py 2>/dev/null || echo 0)
          echo "items=$COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 3 ]; then echo "empty=false" >> "$GITHUB_OUTPUT"
          else echo "empty=true" >> "$GITHUB_OUTPUT"; fi

      - name: Fallback to the other AI provider
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe != 'yes' && steps.digest.outputs.empty == 'true' && steps.guard.outputs.skip != 'yes' }}
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          P="${{ inputs.provider }}"
          if [ -z "$P" ]; then P="groq"; fi
          if [ "$P" = "groq" ]; then NEXT="gemini"; else NEXT="groq"; fi
          echo "primary=$P produced nothing -> retry with $NEXT"
          cp "configs/config.actions.${NEXT}.json" data/config.json
          # 备用 provider 往往额度更小（Gemini 免费层 20 次/天），把单次消耗压到最低
          python scripts/shrink_config.py
          rm -f data/seen.json
          uv run horizon --hours ${{ inputs.hours || '24' }} || echo "fallback run exit=$?"

      - name: Install markdown
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe != 'yes' && steps.guard.outputs.skip != 'yes' }}
        run: python -m pip install --quiet markdown

      - name: Ensure candidate list exists (no AI)
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe != 'yes' && steps.guard.outputs.skip != 'yes' }}
        run: |
          if [ ! -s docs/candidates.json ]; then
            echo "candidates.json missing -> collecting links only"
            python scripts/collect_candidates_only.py data/config.json || true
          fi

      - name: Build mobile digest page
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe != 'yes' && steps.guard.outputs.skip != 'yes' }}
        run: python scripts/build_latest.py

      - name: Show what was produced
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe != 'yes' && steps.guard.outputs.skip != 'yes' }}
        run: |
          ls -l docs/latest.html docs/latest.json || true
          cat docs/latest.json || true

      - name: Deploy to GitHub Pages
        if: steps.guard.outputs.skip != 'yes'
        if: ${{ inputs.probe != 'yes' && steps.guard.outputs.skip != 'yes' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: true
          commit_message: "digest: ${{ github.run_id }}"
