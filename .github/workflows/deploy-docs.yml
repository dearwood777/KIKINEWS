name: Deploy Docs

# 只在手动触发时发布：这个 workflow 发布的是 main 上的 docs/，而每日 digest 是直接写 gh-pages 的，
# main 的 docs 长期是过期快照。让它在 push 时自动跑，就会把当天的新页面覆盖成旧内容
# （2026-11-22 事故：一次 docs/fonts 提交把 11-22 期覆盖成 11-18）。
# 需要发布 main/docs 时，手动 Run workflow 即可。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Package Horizon skill
        run: |
          mkdir -p docs/downloads
          git archive --format=zip --prefix=horizon/ --add-file=LICENSE \
            --output=docs/downloads/horizon-skill.zip HEAD:skills/horizon

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
